// SubTrim: mark known submarine hulls (ModuleSubTrim isSubmarine = true), so SubTrim's Auto mode manages them even
// before a BDArmory AI is set to Submarine. Patches that name a part simply do nothing when the pack is not installed.

// MNWS ("Johnny") SSBN002, single-part SSBN. Ballast: its BallastWater tank (4000 t in the patched MNWS 1.13 update),
// driven as resource ballast. Depth: the BDModuleSurfaceAI (Submarine, CombatAltitude -50) added by MNWS_BDA113.cfg.
@PART[SSBN002]:FOR[SubTrim]
{
	!MODULE[ModuleSubTrim] {}
	MODULE
	{
		name = ModuleSubTrim
		isSubmarine = true
	}
}

// Iron Seas KANES Balao class fleet boat. Ballast: WildBlueTools WBIBallastTank (IntakeLqd) on this hull, or the
// KerbalPowers Naval ModuleShipBallast fallback, or virtual ballast if neither plugin is installed.
@PART[BalaoClassHull]:FOR[SubTrim]
{
	!MODULE[ModuleSubTrim] {}
	MODULE
	{
		name = ModuleSubTrim
		isSubmarine = true
	}
}

// Large Boat Parts Pack (modern) submarine tower; the hull sections carry BallastWater.
@PART[subtower]:NEEDS[LShipPartsModern]:FOR[SubTrim]
{
	!MODULE[ModuleSubTrim] {}
	MODULE
	{
		name = ModuleSubTrim
		isSubmarine = true
	}
}

// Parts that HullBreach 1.8 marks as submarine pressure hulls (submarine = true) need no patch: SubTrim reads
// HullBreachVesselModule.IsSubmarine at run time.
