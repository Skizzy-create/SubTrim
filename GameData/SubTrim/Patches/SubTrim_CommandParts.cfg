// SubTrim: put the SubTrim panel (collapsed PAW group "SubTrim depth & trim") on every command part, so any vessel
// can be switched to SubTrim ("On") from its PAW or an action group, and AI submarines show their trim status.
// Optional: delete this file to keep PAWs clean. BDArmory Submarine-AI vessels and flagged hulls are still managed
// by the vessel module without any panel (with default settings).
@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleSubTrim],!MODULE[KerbalEVA]]:AFTER[SubTrim]
{
	MODULE
	{
		name = ModuleSubTrim
	}
}
