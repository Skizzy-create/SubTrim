// SubTrim 1.0 settings. KSP reads this once at load; restart KSP after editing.
//
// What SubTrim does: for every loaded submarine (BDArmory Surface AI in "Submarine" mode, a part with
// ModuleSubTrim isSubmarine = true, or any vessel whose SubTrim panel is set to "On") it keeps net buoyancy close to
// neutral and nudges it toward the depth the AI is steering to, using the vessel's own ballast:
//   (a) KerbalPowers Naval ModuleShipBallast   (b) BuoyancyAdjuster (only if switched on for that vessel)
//   (c) WildBlueTools WBIBallastTank           (d) ballast-water resources (BALLAST_RESOURCE below)
//   (e) fallback: "virtual ballast" that scales hull part.buoyancy (rate limited, costs EC)
// The AI still flies the boat; SubTrim only makes sure its pitch control has authority.
// It surfaces the boat when the AI wants the surface (deck guns), on a player "Emergency blow", when EC runs low,
// or when HullBreach reports serious flooding.
//
// Units: trims are fractions of vessel weight (0.02 = 2 %), rates per second, depths in metres.
SUBTRIM_SETTINGS
{
	enabled = true
	tickInterval = 0.1			// s between control updates (0.1 = 10 Hz)
	debug = false				// extra KSP.log lines

	// Depth loop: depth error -> commanded vertical speed
	depthGain = 0.05			// (m/s) per m of depth error
	maxClimbRate = 2.0			// m/s
	maxDiveRate = 2.0			// m/s
	captureBand = 15			// m; outside it SubTrim only ever pushes toward the target (never fights the AI)

	// Speed loop: vertical-speed error -> net buoyancy (PI with anti-windup)
	kp = 0.012				// net buoyancy fraction per m/s
	ki = 0.002				// per (m/s x s), integrates only inside captureBand
	maxTrim = 0.02				// |net buoyancy| limit while submerged (keeps the boat near neutral)
	integralLeak = 0			// 1/s bleed of the integrator outside the band

	// Surface / emergencies
	surfaceAltitude = -3			// AI targets above this altitude mean "surface" (BDA uses +1 for deck guns)
	surfaceReserve = 0.15			// reserve buoyancy held while surfaced
	emergencyRateMultiplier = 5		// emergency blow runs this much faster and needs no EC
	lowEcFraction = 0.02			// surface below 2 % EC ...
	resumeEcFraction = 0.10			// ... dive again above 10 %
	hullBreachSurfaceOnCritical = true	// HullBreach 1.8+: surface if any compartment is critical
	hullBreachWaterFraction = 0.05		// ... or flood water exceeds 5 % of vessel mass

	// Safety
	crushSafetyFactor = 0.85		// never hold deeper than 85 % of the shallowest part's crush depth (part.maxPressure)
	keelClearance = 15			// m above the sea floor

	// Pumps driven by SubTrim itself (resource ballast and virtual ballast)
	ecPerTonne = 0.5			// EC per tonne of lift added (flooding is free)
	resourceRateFraction = 0.01		// ballast-water pump rate, fraction of tank capacity per second

	// (e) Virtual ballast, used only when a vessel has no real ballast
	virtualBallast = true
	virtualMinScale = 0.2			// hull buoyancy range, x stock part.buoyancy
	virtualMaxScale = 1.5
	virtualScaleRate = 0.01			// change per second (x stock buoyancy)

	// (a) KerbalPowers Naval: false = SubTrim sets ModuleShipBallast's target flooding (its pump rate and EC apply);
	// true = SubTrim only hands it the target depth and KP's own depth logic runs.
	kpNativeDepthHold = false

	// (b) BuoyancyAdjuster level change per second (1 = 100 %)
	buoyancyAdjusterRate = 0.01

	// (d) Resources treated as ballast water when found on a part (not HullBreach's SeaWater, not WBI's IntakeLqd).
	BALLAST_RESOURCE
	{
		name = BallastWater
	}
}
